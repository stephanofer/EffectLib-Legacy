name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & Verify Bukkit 1.8 Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Bukkit 1.8 Dependency Constraint
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('pom.xml')
          root = tree.getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          bukkit_found = False
          for dep in root.findall('.//m:dependency', ns):
              group = dep.find('m:groupId', ns)
              artifact = dep.find('m:artifactId', ns)
              version = dep.find('m:version', ns)
              if group is not None and group.text == 'org.bukkit' and artifact is not None and artifact.text == 'bukkit':
                  bukkit_found = True
                  if version is None or version.text != '1.8.8-R0.1-SNAPSHOT':
                      print('::error::Bukkit dependency version must be 1.8.8-R0.1-SNAPSHOT, found: ' + str(version.text if version is not None else None))
                      exit(1)
          if not bukkit_found:
              print('::error::Bukkit dependency not found in pom.xml')
              exit(1)
          print('Bukkit 1.8.8 dependency verified.')
          "

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EffectLib-Legacy-jar
          path: target/EffectLib-*.jar
